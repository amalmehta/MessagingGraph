[project]
name = "messaging-graph"
version = "1.1.0"
description = "A private, local app for keeping up with the people in your Messages history"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "cryptography>=43",
    "keyring>=25",
    "vaderSentiment>=3.3",
]

# Only needed to run validate.py; `uv sync` installs it by default.
[dependency-groups]
dev = [
    "httpx2",
]
# Only needed to build the Mac app: `uv sync --group app`, then `./mg build-app`.
app = [
    "pyinstaller>=6.10",
    "pyobjc-framework-Cocoa>=10",
    "pyobjc-framework-WebKit>=10",
]

[tool.uv]
package = false
