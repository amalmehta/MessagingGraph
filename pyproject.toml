[project]
name = "messaging-graph"
version = "1.0.0"
description = "A private, local app for keeping up with the people in your Messages history"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "cryptography>=43",
    "keyring>=25",
    "vaderSentiment>=3.3",
]

# Only needed to run validate.py; `uv sync` installs it by default.
[dependency-groups]
dev = [
    "httpx2",
]

[tool.uv]
package = false
