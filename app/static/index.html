<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>messaging graph</title>
<!-- Added to the Home Screen on a phone, this opens with no browser chrome. The
     apple-* pair is what iOS reads; display:standalone in the manifest is the
     standard spelling of the same thing. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="messaging">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#191b1f" media="(prefers-color-scheme:dark)">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="stylesheet" href="/static/styles.css">
<script src="/static/theme.js"></script>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M7 15 L15 8 L16 17 Z"/><circle cx="7" cy="15" r="3.4" class="m1"/>
      <circle cx="15" cy="8" r="4" class="m2"/><circle cx="16" cy="17" r="2.7" class="m3"/></svg>
      <span>messaging graph<small id="src">loading</small></span></div>
    <div id="platforms" class="platbar" role="group" aria-label="Which history to show" hidden></div>
    <form id="askform" role="search" autocomplete="off">
      <input id="ask" type="search" placeholder="Ask anything…" aria-label="Search everything"
        maxlength="120">
    </form>
    <nav aria-label="Views">
      <button type="button" data-view="now" class="on">Now <span class="c" id="c-now"></span></button>
      <button type="button" data-view="graph">My brainstorm <span class="c" id="c-graph"></span></button>
      <button type="button" data-view="people">People <span class="c" id="c-people"></span></button>
      <button type="button" data-view="insights">Insights <span class="c" id="c-insights"></span></button>
      <button type="button" data-view="privacy">Privacy <span class="c" id="c-priv"></span></button>
    </nav>
    <div class="themepick" role="group" aria-label="Colour theme">
      <button type="button" data-theme-set="auto">Auto</button>
      <button type="button" data-theme-set="light">Light</button>
      <button type="button" data-theme-set="dark">Dark</button>
    </div>
    <div class="sidefoot">
      <span class="dot"></span><span id="foot-mode">local only</span><br>
      <span id="foot-span"></span>
      <button type="button" id="reload" class="reload">Reload data</button>
    </div>
  </aside>
  <main id="main"></main>
  <!-- Empty on a desktop. On a phone app.js moves the theme switch and the
       source/reload line in here, out of the sidebar that has become tabs. -->
  <div id="phonefoot" hidden></div>
</div>
<div class="scrim" id="scrim"></div>
<!-- Anything the app says in passing -- "Priya archived", "Lisbon it is" -- goes
     here too, or it is only ever said to people who can see the toast. -->
<div id="live" class="sr-only" role="status" aria-live="polite"></div>
<div class="drawer" id="drawer"></div>
<script src="/static/app.js"></script>
</body>
</html>
